identity:
  name: suno_upload_reference_audio
  author: acedatacloud
  label:
    en_US: Suno Upload Reference Audio
    zh_Hans: Suno 上传参考音频
description:
  human:
    en_US: Upload Reference Audio through the Ace Data Cloud Suno API.
    zh_Hans: 通过 Ace Data Cloud Suno API 执行 Upload Reference Audio。
  llm: Upload Reference Audio through the Ace Data Cloud Suno API. For asynchronous
    results, preserve task_id and use the task retrieval tool until completion. A
    successful submission is not completed output.
parameters:
- name: audio_url
  type: string
  required: true
  form: form
  label:
    en_US: Audio Url
    zh_Hans: 音频链接
  human_description:
    en_US: Set audio url for this operation.
    zh_Hans: 待处理的自定义音频 URL，必须可公开访问；该输入地址不会由终态媒体持久化流程预先转存。
  llm_description: Set audio url for this operation.
- name: mode
  type: select
  required: false
  form: form
  label:
    en_US: Mode
    zh_Hans: 模式
  human_description:
    en_US: Set mode for this operation.
    zh_Hans: 上传模式。`standard` 成功处理消耗 0.06 Credits；`enhanced` 用于部分普通上传无法处理的授权音频，固定异步执行，成功处理消耗
      1.87 Credits。处理失败不扣费。
  llm_description: Set mode for this operation.
  options:
  - value: standard
    label:
      en_US: standard
      zh_Hans: standard
  - value: enhanced
    label:
      en_US: enhanced
      zh_Hans: enhanced
- name: name
  type: string
  required: false
  form: form
  label:
    en_US: Name
    zh_Hans: 名称
  human_description:
    en_US: Set name for this operation.
    zh_Hans: 音频名称。`mode=enhanced` 时必填，长度为 1 至 100 个字符。
  llm_description: Set name for this operation.
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 可选的 HTTPS 回调地址。增强上传完成或失败后，结果将发送至该地址。
  llm_description: Set callback url for this operation.
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/suno_upload_reference_audio.py
