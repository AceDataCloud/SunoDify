identity:
  name: suno_generate_lyrics
  author: acedatacloud
  label:
    en_US: Suno Generate Lyrics
    zh_Hans: Suno 生成歌词
description:
  human:
    en_US: Generate Lyrics through the Ace Data Cloud Suno API.
    zh_Hans: 通过 Ace Data Cloud Suno API 执行 Generate Lyrics。
  llm: Generate Lyrics through the Ace Data Cloud Suno API. For asynchronous results,
    preserve task_id and use the task retrieval tool until completion. A successful
    submission is not completed output.
parameters:
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 用于生成歌词的模型，默认值为 `default`，可选值包括 `default` 和 `remi-v1`。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: default
  options:
  - value: default
    label:
      en_US: default
      zh_Hans: default
  - value: remi-v1
    label:
      en_US: remi-v1
      zh_Hans: remi-v1
- name: prompt
  type: string
  required: true
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Set prompt for this operation.
    zh_Hans: 用于生成歌词的提示词，描述期望的歌词主题或风格。
  llm_description: Set prompt for this operation.
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/suno_generate_lyrics.py
