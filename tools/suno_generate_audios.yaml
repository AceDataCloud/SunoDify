    zh_Hans: 声音描述
  human_description:
    en_US: Set sound for this operation.
    zh_Hans: 要生成的音效描述，当 `action` 为 `sounds` 时必填。
  llm_description: Set sound for this operation.
- name: sound_type
  type: select
  required: false
  form: form
  label:
    en_US: Sound Type
    zh_Hans: 声音类型
  human_description:
    en_US: Set sound type for this operation.
    zh_Hans: 音效类型，当 `action` 为 `sounds` 时必填。`one-shot` 表示单次音效，`loop` 表示可循环音效。
