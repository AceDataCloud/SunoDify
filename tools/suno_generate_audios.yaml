    zh_Hans: 补写结束时间
  human_description:
    en_US: Set underpainting end for this operation.
    zh_Hans: 为已上传音频添加 AI 伴奏的结束时间，必须小于歌曲的总时长。
  llm_description: Set underpainting end for this operation.
- name: continue_at
  type: number
  required: false
  form: form
  label:
    en_US: Continue At
    zh_Hans: 续写开始时间
  human_description:
    en_US: Set continue at for this operation.
    zh_Hans: 续写边界，单位为秒。例如，213.5 表示从第 3 分钟 33.5 秒处开始生成后续片段。`lyric` 和 `style` 只引导该边界之后的新内容，不会替换源音频中边界之前的歌词或演唱；若要让整首歌曲使用新歌词，请使用
      `generate` 重新生成，或使用 `cover` 重新演绎。
  llm_description: Set continue at for this operation.
