  form: form
  label:
    en_US: Stem Type
    zh_Hans: 音轨类型
  human_description:
    en_US: Set stem type for this operation.
    zh_Hans: 音轨类型。当 `action` 为 `add_stem` 或 `extract_stem` 时必填；支持 `vocals`、`backing_vocals`、`drums`、`bass`、`guitar`、`keyboard`、`percussion`、`strings`、`synth`、`fx`、`brass`、`woodwinds`。
  llm_description: Set stem type for this operation.
  options:
  - value: vocals
    label:
      en_US: vocals
      zh_Hans: vocals
  - value: backing_vocals
    label:
      en_US: backing_vocals
      zh_Hans: backing_vocals
  - value: drums
    label:
      en_US: drums
      zh_Hans: drums
  - value: bass
    label:
      en_US: bass
      zh_Hans: bass
  - value: guitar
    label:
      en_US: guitar
      zh_Hans: guitar
  - value: keyboard
    label:
      en_US: keyboard
      zh_Hans: keyboard
  - value: percussion
    label:
      en_US: percussion
      zh_Hans: percussion
  - value: strings
    label:
      en_US: strings
      zh_Hans: strings
  - value: synth
    label:
      en_US: synth
      zh_Hans: synth
  - value: fx
    label:
      en_US: fx
      zh_Hans: fx
  - value: brass
    label:
      en_US: brass
      zh_Hans: brass
  - value: woodwinds
    label:
      en_US: woodwinds
      zh_Hans: woodwinds
- name: audio_format
  type: select
