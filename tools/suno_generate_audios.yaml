identity:
  name: suno_generate_audios
  author: acedatacloud
  label:
    en_US: Suno Generate Audios
    zh_Hans: Suno 生成歌曲
description:
  human:
    en_US: Generate songs with Ace Data Cloud Suno Audios API.
    zh_Hans: 通过 Ace Data Cloud Suno Audios API 生成歌曲。
  llm: Generate songs with Ace Data Cloud Suno Audios API. For asynchronous results,
    preserve task_id and use the task retrieval tool until completion. A successful
    submission is not completed output.
parameters:
- name: lyric
  type: string
  required: false
  form: llm
  label:
    en_US: Lyric
    zh_Hans: 歌词
  human_description:
    en_US: Lyrics for custom mode; omit for instrumental music.
    zh_Hans: 自定义模式（`custom` 为 `true`）下用于生成音乐的歌词。`chirp-v3-5` 与 `chirp-v4` 最多 3000
      字符；`chirp-v4-5` 及以上（含 `chirp-v5`、`chirp-v5-5`）最多 5000 字符。
  llm_description: Lyrics for custom mode; omit for instrumental music.
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 用于生成音乐的模型。支持 `chirp-v6`、`chirp-v6-wild` 和 `chirp-v6-mini`；推荐使用 `chirp-v6`。旧模型名称继续兼容。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: chirp-v6
  options:
  - value: chirp-v6
    label:
      en_US: chirp-v6
      zh_Hans: chirp-v6
  - value: chirp-v6-wild
    label:
      en_US: chirp-v6-wild
      zh_Hans: chirp-v6-wild
  - value: chirp-v6-mini
    label:
      en_US: chirp-v6-mini
      zh_Hans: chirp-v6-mini
  - value: chirp-v5-5
    label:
      en_US: chirp-v5-5
      zh_Hans: chirp-v5-5
  - value: chirp-v5
    label:
      en_US: chirp-v5
      zh_Hans: chirp-v5
  - value: chirp-v4-5-plus
    label:
      en_US: chirp-v4-5-plus
      zh_Hans: chirp-v4-5-plus
  - value: chirp-v4-5
    label:
      en_US: chirp-v4-5
      zh_Hans: chirp-v4-5
  - value: chirp-v4
    label:
      en_US: chirp-v4
      zh_Hans: chirp-v4
  - value: chirp-v3-5
    label:
      en_US: chirp-v3-5
      zh_Hans: chirp-v3-5
  - value: chirp-v3-0
    label:
      en_US: chirp-v3-0
      zh_Hans: chirp-v3-0
- name: max_mode
  type: boolean
  required: false
  form: form
  label:
    en_US: Max Mode
    zh_Hans: Max 模式
  human_description:
    en_US: Set max mode for this operation.
    zh_Hans: 是否启用增强生成模式。仅支持 `generate`（同时要求 `custom` 为 `true`）和 `add_stem`。开启后分别消耗
      1.12 和 1.344 Credits；关闭或省略时按普通模式计费。其他 action 传入该参数会返回 400。
  llm_description: Set max mode for this operation.
- name: variety
  type: select
  required: false
  form: form
  label:
    en_US: Variety
    zh_Hans: 多样性
  human_description:
    en_US: Set variety for this operation.
    zh_Hans: 生成结果的多样性强度，可选 `off`、`normal`、`high`、`extra`、`max`。仅支持 `generate` 和 `add_stem`；其他
      action 传入会返回 400。
  llm_description: Set variety for this operation.
  options:
  - value: 'off'
    label:
      en_US: 'off'
      zh_Hans: 'off'
  - value: normal
    label:
      en_US: normal
      zh_Hans: normal
  - value: high
    label:
      en_US: high
      zh_Hans: high
  - value: extra
    label:
      en_US: extra
      zh_Hans: extra
  - value: max
    label:
      en_US: max
      zh_Hans: max
- name: style
  type: string
  required: false
  form: form
  label:
    en_US: Style
    zh_Hans: 风格
  human_description:
    en_US: Describe the genre, tempo and instruments.
    zh_Hans: 音乐风格描述。`chirp-v3-5` 与 `chirp-v4` 最多 200 字符；`chirp-v4-5` 及以上（含 `chirp-v5`、`chirp-v5-5`）最多
      1000 字符。 当 `action` 为 `add_stem` 时可选。
  llm_description: Describe the genre, tempo and instruments.
- name: variation_category
  type: select
  required: false
  form: form
  label:
    en_US: Variation Category
    zh_Hans: 变奏强度
  human_description:
    en_US: Set variation category for this operation.
    zh_Hans: 重制变化幅度，仅用于 `remaster`，可选 `high`、`normal`、`subtle`。
  llm_description: Set variation category for this operation.
  options:
  - value: high
    label:
      en_US: high
      zh_Hans: high
  - value: normal
    label:
      en_US: normal
      zh_Hans: normal
  - value: subtle
    label:
      en_US: subtle
      zh_Hans: subtle
- name: title
  type: string
  required: false
  form: form
  label:
    en_US: Title
    zh_Hans: 标题
  human_description:
    en_US: Title of the generated song.
    zh_Hans: 音乐标题（自定义模式）。`chirp-v3-5`、`chirp-v4` 最多 80 字符；`chirp-v4-5` 及以上（含 `chirp-v5`、`chirp-v5-5`）最多
      100 字符。 当 `action` 为 `add_stem` 时可选；当 `action` 为 `adjust_speed` 时必填。
  llm_description: Title of the generated song.
- name: action
  type: select
  required: false
  form: form
  label:
    en_US: Action
    zh_Hans: 操作
  human_description:
    en_US: Set action for this operation.
    zh_Hans: 生成音乐的操作类型。`generate`：根据提示词生成音频；`extend`：在已有音频基础上续生成；`concat`：将已有音频片段拼接为完整曲目；`cover`：复制已有曲目的音乐风格并重新演绎；`upload_cover`：对已上传的音频进行风格翻唱；`upload_extend`：将已上传的音频延伸续生成；`artist_consistency`：以指定歌手风格（Persona）演唱新歌曲；`artist_consistency_vox`：以
      VOX 模式使用指定歌手风格演唱新歌曲；`stems`：将歌曲分离为人声和伴奏两轨；`all_stems`：将歌曲分离为所有独立音轨（人声、鼓、贝斯、其他乐器）；`add_stem`：为已有音频添加新音轨，必填
      `audio_id`、`stem_type`，可选 `prompt`、`title`、`style`；`extract_stem`：从已有音频中提取指定音轨，必填
      `audio_id`、`stem_type`，可选 `audio_format`；`sounds`：生成独立音效，必填 `sound`、`sound_type`，可选
      `bpm`、`key`；`adjust_speed`：调整已有音频的播放速度，必填 `audio_id`、`speed_multiplier`、`title`，`keep_pitch`
      可选；`replace_section`：替换指定时间段内的片段；`underpainting`：为已上传的人声轨道生成并添加 AI 伴奏；`overpainting`：为已上传的伴奏轨道生成并添加
      AI 人声；`samples`：从一段已有音频中选择起止区间进行采样创作；`remaster`：对已有音频进行重新母带处理以提升音质；`mashup`：将多首歌曲混合拼接为一首曲目；`inspo`：Inspo
      灵感创作功能，使用 1 到 4 段拖拽或上传的参考音频启发全新音乐创作。
  llm_description: Set action for this operation.
  default: generate
  options:
  - value: generate
    label:
      en_US: generate
      zh_Hans: generate
  - value: extend
    label:
      en_US: extend
      zh_Hans: extend
  - value: upload_extend
    label:
      en_US: upload_extend
      zh_Hans: upload_extend
  - value: upload_cover
    label:
      en_US: upload_cover
      zh_Hans: upload_cover
  - value: concat
    label:
      en_US: concat
      zh_Hans: concat
  - value: cover
    label:
      en_US: cover
      zh_Hans: cover
  - value: artist_consistency
    label:
      en_US: artist_consistency
      zh_Hans: artist_consistency
  - value: artist_consistency_vox
    label:
      en_US: artist_consistency_vox
      zh_Hans: artist_consistency_vox
  - value: stems
    label:
      en_US: stems
      zh_Hans: stems
  - value: all_stems
    label:
      en_US: all_stems
      zh_Hans: all_stems
  - value: add_stem
    label:
      en_US: add_stem
      zh_Hans: add_stem
  - value: extract_stem
    label:
      en_US: extract_stem
      zh_Hans: extract_stem
  - value: sounds
    label:
      en_US: sounds
      zh_Hans: sounds
  - value: adjust_speed
    label:
      en_US: adjust_speed
      zh_Hans: adjust_speed
  - value: replace_section
    label:
      en_US: replace_section
      zh_Hans: replace_section
  - value: underpainting
    label:
      en_US: underpainting
      zh_Hans: underpainting
  - value: overpainting
    label:
      en_US: overpainting
      zh_Hans: overpainting
  - value: remaster
    label:
      en_US: remaster
      zh_Hans: remaster
  - value: mashup
    label:
      en_US: mashup
      zh_Hans: mashup
  - value: samples
    label:
      en_US: samples
      zh_Hans: samples
  - value: inspo
    label:
      en_US: inspo
      zh_Hans: inspo
- name: custom
  type: boolean
  required: false
  form: form
  label:
    en_US: Custom Mode
    zh_Hans: 自定义模式
  human_description:
    en_US: Use style and custom lyrics when enabled; otherwise describe the song in
      the prompt.
    zh_Hans: 是否启用自定义模式的标志。若为 `true`，音频将根据歌词生成；否则将根据提示词生成。
  llm_description: Use style and custom lyrics when enabled; otherwise describe the
    song in the prompt.
  default: false
- name: prompt
  type: string
  required: false
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Music description
    zh_Hans: 灵感模式（`custom` 为 `false` 时生效）下用于生成音乐的提示词，长度不得超过 500 个字符。自定义模式请改用 `lyric`
      与 `style`。 当 `action` 为 `add_stem` 时，此字段可选，用于描述要添加的音轨。
  llm_description: Music description
- name: lyric_prompt
  type: string
  required: false
  form: form
  label:
    en_US: Lyric Prompt
    zh_Hans: 歌词提示词
  human_description:
    en_US: Set lyric prompt for this operation.
    zh_Hans: 用于自动生成歌词的提示词，仅在 `custom` 为 `true` 且 `lyric` 为空时生效
  llm_description: Set lyric prompt for this operation.
- name: audio_id
  type: string
  required: false
  form: form
  label:
    en_US: Audio Id
    zh_Hans: 音频 ID
  human_description:
    en_US: Set audio id for this operation.
    zh_Hans: 已有音频的 ID。当 `action` 为 `extend`、`concat`、`add_stem`、`extract_stem` 或 `adjust_speed`
      时，此字段必填。
  llm_description: Set audio id for this operation.
- name: stem_type
  type: select
